name = "temp-mail-worker"
main = "src/index.js"
compatibility_date = "2026-11-26"

# Create the KV namespace first, then paste its id here:
#   npx wrangler kv namespace create TEMP_MAIL
[[kv_namespaces]]
binding = "TEMP_MAIL"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Inbox lifetime in seconds (1 hour)
MESSAGE_TTL_SECONDS = "3600"
ALLOWED_DOMAINS = "toolkitgen.xyz,toolkithub.site"
